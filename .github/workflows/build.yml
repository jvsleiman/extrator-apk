name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (release, sem assinatura)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Separar APK e apksigner
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          mkdir out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/ExtratorAPK-unsigned.apk
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" out/
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -P 16 4 out/ExtratorAPK-unsigned.apk && echo "zipalign OK"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ExtratorAPK-unsigned
          path: out/

      - name: Publicar no branch builds
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan builds
          git rm -rf -q --cached .
          git add -f out/
          git commit -q -m "APK de ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER})"
          git push -f origin builds
